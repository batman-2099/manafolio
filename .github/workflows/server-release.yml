name: Build Server Binaries

# push a v* tag -> build the self-hosted server binary for Windows, Linux and
# macOS and attach each archive to the GitHub Release. workflow_dispatch ->
# build only, uploaded as workflow artifacts (test). Each binary is a Node
# Single Executable App (stdlib, no third-party packager) whose blob is just
# backend/launch.js; the real server ships beside it under app/ (backend src +
# node_modules + frontend build). Scan models/catalogs and .env are NOT bundled.
# Install scan assets through Admin -> Catalogs and configure app/backend/.env.
# Scanning also needs native Tesseract with English data; without a usable
# catalog the scanner returns HTTP 503, including set-scoped requests.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --prefix backend && npm ci --prefix frontend
      - name: Test backend
        run: npm test --prefix backend
      - name: Release policy regressions
        run: node backend/test/desktoprelease.test.cjs
      - name: Check frontend
        run: npm run lint --prefix frontend && npm test --prefix frontend
      - name: Frontend browser regressions
        run: |
          npm ci --prefix desktop/electron
          node desktop/electron/node_modules/electron/install.js
          sudo chown root:root desktop/electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/electron/node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run test:browser --prefix frontend

  server:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            exe: manafolio-server.exe
            archive: zip
          - os: ubuntu-22.04
            target: linux-x64
            exe: manafolio-server
            archive: tar
          - os: macos-latest
            target: macos-arm64
            exe: manafolio-server
            archive: tar
          - os: macos-15-intel
            target: macos-x64
            exe: manafolio-server
            archive: tar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Prod deps only, compiled natively for this runner's OS/arch.
      - name: Install backend deps (prod)
        working-directory: backend
        run: npm ci --omit=dev

      # Upstream's npm package omits Intel macOS binaries; build the locked version.
      - name: Build Intel macOS inference runtime
        if: matrix.target == 'macos-x64'
        run: |
          ORT_VERSION=$(node -p "require('./backend/node_modules/onnxruntime-node/package.json').version")
          git clone --depth 1 --branch "v$ORT_VERSION" --recurse-submodules --shallow-submodules https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          "$RUNNER_TEMP/onnxruntime/build.sh" --config Release --build_nodejs --parallel 3 --update --build \
            --build_dir "$RUNNER_TEMP/onnxruntime/build/MacOS" \
            --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64 CMAKE_OSX_DEPLOYMENT_TARGET=14.4 onnxruntime_BUILD_UNIT_TESTS=OFF
          cp -R "$RUNNER_TEMP/onnxruntime/js/node/bin/napi-v6/darwin/x64" backend/node_modules/onnxruntime-node/bin/napi-v6/darwin/
          node -e "console.log(require('./backend/node_modules/onnxruntime-node').env.versions)"

      - name: Prepare Linux desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 xvfb
          # The published sqlite3 prebuild requires newer glibc than Ubuntu 22.04.
          npm rebuild sqlite3 --build-from-source --prefix backend

      - name: Prepare desktop runtime
        if: runner.os != 'macOS'
        run: |
          npm ci --prefix desktop/electron
          node desktop/electron/node_modules/electron/install.js

      - name: Build SEA blob
        run: |
          echo '{ "main": "backend/launch.js", "output": "sea-prep.blob" }' > sea-config.json
          node --experimental-sea-config sea-config.json

      # Copy this runner's node binary, inject the SEA blob. macOS must strip the
      # existing signature before injection and re-sign (ad-hoc) after.
      - name: Assemble binary + release tree
        run: |
          ROOT=build/manafolio-server
          mkdir -p "$ROOT/app/backend" "$ROOT/app/frontend"
          EXE="$ROOT/${{ matrix.exe }}"
          node -e "require('fs').copyFileSync(process.execPath, process.argv[1])" "$EXE"
          FUSE=NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --remove-signature "$EXE"
            npx --yes postject@1.0.0-alpha.6 "$EXE" NODE_SEA_BLOB sea-prep.blob --sentinel-fuse "$FUSE" --macho-segment-name NODE_SEA
            codesign --sign - "$EXE"
          else
            npx --yes postject@1.0.0-alpha.6 "$EXE" NODE_SEA_BLOB sea-prep.blob --sentinel-fuse "$FUSE"
          fi
          chmod +x "$EXE" || true
          cp -r backend/src          "$ROOT/app/backend/src"
          cp -r backend/node_modules "$ROOT/app/backend/node_modules"
          cp    backend/package.json "$ROOT/app/backend/package.json"
          # backend/src/utils/compartmentSort.js requires ../../../shared/*.json,
          # which lands at app/shared here. Omitting it crashed the binary at
          # startup with MODULE_NOT_FOUND before it could even listen.
          cp -r shared               "$ROOT/app/shared"
          cp -r frontend/dist        "$ROOT/app/frontend/dist"
          cp    .env.example         "$ROOT/app/backend/.env.example"

      - name: Bundle Windows native runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ redistributable source was not found' }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'x64 Visual C++ CRT directory was not found' }
          # Node loads addons with LOAD_WITH_ALTERED_SEARCH_PATH: put their CRT
          # dependencies beside the addon, not only beside the server executable.
          $destination = 'build/manafolio-server/app/backend/node_modules/onnxruntime-node/bin/napi-v6/win32/x64'
          foreach ($name in @('msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_atomic_wait.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $source = Join-Path $crt.FullName $name
            Copy-Item -LiteralPath $source -Destination $destination
            Write-Host "$name $((Get-Item $source).VersionInfo.FileVersion)"
          }

      # Boot the assembled tree for real. A packaged binary that cannot start is
      # invisible to every other test in this repo — they all run from source,
      # where ../../../shared resolves and node_modules is hoisted differently.
      #
      # Runs against a COPY: starting the server creates a database (with a
      # generated admin user) and a log beside the exe, and on Windows it holds
      # those files open. Testing the tree we are about to ship would both
      # package that database and break the archive step on a locked file.
      - name: Smoke test the packaged binary
        run: |
          cp -r build/manafolio-server build/smoketest
          cd build/smoketest
          ./${{ matrix.exe }} > boot.log 2>&1 &
          SRV=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server answered /api/health."
              ok=1
              break
            fi
            # Died on startup — exactly the failure this step exists to catch.
            if ! kill -0 "$SRV" 2>/dev/null; then
              echo "::error::Packaged server exited before serving a request."
              break
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || echo "::error::Packaged server never answered /api/health."
          echo '--- server output ---'
          cat boot.log || true
          kill "$SRV" 2>/dev/null || true
          wait "$SRV" 2>/dev/null || true
          [ "$ok" = 1 ]

      - name: Write README
        run: |
          ROOT=build/manafolio-server
          if [ "${{ runner.os }}" = "Windows" ]; then
            RUN='Run: double-click manafolio-server.exe'
          else
            RUN='Run: ./manafolio-server (chmod +x first if needed)'
          fi
          cat > "$ROOT/README.txt" <<EOF
          Manafolio self-hosted server (${{ matrix.target }}).

          $RUN
          Then open http://localhost:3001
          Config: copy app/backend/.env.example to app/backend/.env and edit.
          With no DEFAULT_ADMIN_PASSWORD, the first browser visit creates the
          owner account. Protect access until setup is complete.
          Scanning needs models and a usable catalog installed through
          Admin -> Catalogs, plus /usr/bin/tesseract with English trained data.
          The binary archive does not bundle those assets or native OCR.
          Without a usable catalog, scan requests return HTTP 503.
          Native scanning and ChatGPT/Codex require the supported Unix runtime;
          use Docker for these features on Windows.
          EOF

      # Archive the tree contents at the root (no wrapping folder), matching the
      # original layout server.js expects.
      - name: Package
        run: |
          NAME="Manafolio-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ( cd build/manafolio-server && 7z a "$GITHUB_WORKSPACE/$NAME.zip" ./* >/dev/null )
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" -C build/manafolio-server .
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          APPDIR=build/Manafolio.AppDir
          cp -r build/manafolio-server "$APPDIR"
          cp frontend/public/logo.svg "$APPDIR/manafolio.svg"
          cp -r desktop/electron/node_modules/electron/dist "$APPDIR/desktop"
          mkdir -p "$APPDIR/desktop/resources/app"
          cp desktop/electron/package.json desktop/electron/main.cjs "$APPDIR/desktop/resources/app/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          exec "$(dirname "$(readlink -f "$0")")/desktop/electron" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/manafolio.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Manafolio
          Comment=Magic collection, storage, and decks
          Exec=AppRun
          Icon=manafolio
          Terminal=false
          Categories=Game;
          EOF
          curl -fL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o build/appimagetool
          chmod +x build/appimagetool
          ARCH=x86_64 build/appimagetool --appimage-extract-and-run "$APPDIR" build/Manafolio-linux-x64.AppImage

      - name: Smoke test Linux AppImage
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node backend/scripts/smoke-linux.js ./build/Manafolio-linux-x64.AppImage ./build/linux-desktop-smoke

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: manafolio-linux-desktop-smoke
          path: build/linux-desktop-smoke/*.png

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: manafolio-server-linux-x64-appimage
          path: build/Manafolio-linux-x64.AppImage

      - name: Attach AppImage to release
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Manafolio-linux-x64.AppImage

      - name: Build Windows desktop installer
        if: runner.os == 'Windows'
        run: |
          cp -r build/manafolio-server build/Manafolio-windows
          cp -r desktop/electron/node_modules/electron/dist build/Manafolio-windows/desktop
          mv build/Manafolio-windows/desktop/electron.exe build/Manafolio-windows/desktop/Manafolio.exe
          mkdir -p build/Manafolio-windows/desktop/resources/app
          cp desktop/electron/package.json desktop/electron/main.cjs build/Manafolio-windows/desktop/resources/app/
          node -e "require('./backend/node_modules/sharp')('frontend/public/logo.svg').resize(256,256).png().toBuffer().then(png => { const header = Buffer.alloc(22); header.writeUInt16LE(1,2); header.writeUInt16LE(1,4); header.writeUInt16LE(1,10); header.writeUInt16LE(32,12); header.writeUInt32LE(png.length,14); header.writeUInt32LE(22,18); require('fs').writeFileSync('build/Manafolio-windows/manafolio.ico',Buffer.concat([header,png])); })"
          VERSION=$(node -p "require('./backend/package.json').version")
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$VERSION" desktop/windows/installer.iss

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        run: node backend/scripts/smoke-windows.js ./build/Manafolio-Setup-windows-x64.exe ./build/windows-desktop-smoke

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: manafolio-windows-desktop-smoke
          path: |
            build/windows-desktop-smoke/**/*.png
            build/windows-desktop-smoke/*.log

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: manafolio-windows-x64-installer
          path: build/Manafolio-Setup-windows-x64.exe

      - name: Attach Windows installer to release
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Manafolio-Setup-windows-x64.exe

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          APP=build/dmg/Manafolio.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          swiftc -target "$(uname -m)-apple-macos14.4" backend/macos/Manafolio.swift -o "$APP/Contents/MacOS/Manafolio"
          cp -R build/manafolio-server "$APP/Contents/Resources/server"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Manafolio</string>
            <key>CFBundleName</key><string>Manafolio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>manafolio.icns</string>
            <key>LSMinimumSystemVersion</key><string>14.4</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSCameraUsageDescription</key><string>Manafolio uses your camera to scan Magic cards when you start scanning.</string>
            <key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict></plist>
          EOF
          VERSION=$(node -p "require('./backend/package.json').version")
          plutil -replace CFBundleIdentifier -string app.manafolio.server "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          mkdir -p build/manafolio.iconset
          node -e "require('./backend/node_modules/sharp')('frontend/public/logo.svg').resize(1024, 1024).png().toFile('build/icon.png').catch(e => { console.error(e); process.exit(1); })"
          for SIZE in 16 32 128 256 512; do
            sips -z "$SIZE" "$SIZE" build/icon.png --out "build/manafolio.iconset/icon_${SIZE}x${SIZE}.png" >/dev/null
            DOUBLE=$((SIZE * 2))
            sips -z "$DOUBLE" "$DOUBLE" build/icon.png --out "build/manafolio.iconset/icon_${SIZE}x${SIZE}@2x.png" >/dev/null
          done
          iconutil -c icns build/manafolio.iconset -o "$APP/Contents/Resources/manafolio.icns"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Manafolio -srcfolder build/dmg -format UDZO build/Manafolio-${{ matrix.target }}.dmg

      - name: Smoke test mounted macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg-mounted
          hdiutil attach build/Manafolio-${{ matrix.target }}.dmg -readonly -nobrowse -mountpoint "$PWD/build/dmg-mounted"
          trap 'hdiutil detach "$PWD/build/dmg-mounted"' EXIT
          node backend/scripts/smoke-package.js "$PWD/build/dmg-mounted/Manafolio.app/Contents/Resources/server/manafolio-server"
          cp -R build/dmg-mounted/Manafolio.app build/mac-wrapper-smoke.app
          swiftc -D SMOKE_TEST -target "$(uname -m)-apple-macos14.4" backend/macos/Manafolio.swift -o build/mac-wrapper-smoke.app/Contents/MacOS/Manafolio
          codesign --force --deep --sign - build/mac-wrapper-smoke.app
          node backend/scripts/smoke-macos.js "$PWD/build/mac-wrapper-smoke.app" "$PWD/build/mac-wrapper-smoke-data"

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: manafolio-${{ matrix.target }}-wrapper-smoke
          path: |
            build/mac-wrapper-smoke-data/Library/Application Support/Manafolio/wrapper.png
            build/mac-wrapper-smoke-data/Library/Application Support/Manafolio/desktop.log

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: manafolio-server-${{ matrix.target }}-dmg
          path: build/Manafolio-${{ matrix.target }}.dmg

      - name: Attach DMG to release
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Manafolio-${{ matrix.target }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: manafolio-server-${{ matrix.target }}
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
